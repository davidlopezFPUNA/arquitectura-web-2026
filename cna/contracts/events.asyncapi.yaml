asyncapi: '3.0.0'
info:
  title: Bus de Eventos PocketBase - Ecosistema FPUNA
  version: '1.0.0'
  description: Canales de eventos para integracion asincrona del monolito PocketBase.
  contact:
    name: Soporte FPUNA
    url: https://www.pol.una.py
    email: soporte@fpuna.edu.py
  license:
    name: MIT
  tags:
    - name: PocketBase
      description: Canales de eventos emitidos desde el monolito

servers:
  nats:
    host: localhost:4222
    protocol: nats
    description: Broker NATS JetStream para la gestion de eventos

channels:
  pocketbaseContactCreated:
    address: pocketbase.contact.created
    messages:
      contactCreated:
        $ref: '#/components/messages/ContactCreatedMessage'

  pocketbaseContactUpdated:
    address: pocketbase.contact.updated
    messages:
      contactUpdated:
        $ref: '#/components/messages/ContactUpdatedMessage'

  pocketbaseContactDeleted:
    address: pocketbase.contact.deleted
    messages:
      contactDeleted:
        $ref: '#/components/messages/ContactDeletedMessage'

  exportRequested:
    address: export.requested
    messages:
      exportReq:
        $ref: '#/components/messages/ExportRequestedMessage'

  exportCompleted:
    address: export.completed
    messages:
      exportComp:
        $ref: '#/components/messages/ExportCompletedMessage'

  mediaUploaded:
    address: media.uploaded
    messages:
      mediaUp:
        $ref: '#/components/messages/MediaUploadedMessage'

components:
  messages:
    ContactCreatedMessage:
      name: ContactCreatedMessage
      title: Evento de Creacion de Contacto
      payload:
        type: object
        properties:
          event_id: { type: string, format: uuid }
          type: { type: string, example: "pocketbase.contact.created" }
          version: { type: string, example: "1.0.0" }
          occurred_at: { type: string, format: date-time }
          request_id: { type: string }
          payload: { type: object }

    ContactUpdatedMessage:
      name: ContactUpdatedMessage
      payload:
        type: object

    ContactDeletedMessage:
      name: ContactDeletedMessage
      payload:
        type: object

    ExportRequestedMessage:
      name: ExportRequestedMessage
      payload:
        type: object

    ExportCompletedMessage:
      name: ExportCompletedMessage
      payload:
        type: object

    MediaUploadedMessage:
      name: MediaUploadedMessage
      payload:
        type: object
