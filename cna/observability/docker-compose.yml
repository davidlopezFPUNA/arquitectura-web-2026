services:
  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    container_name: obs-nats-exporter
    network_mode: host
    command: ["-p", "7777", "-jsz=all", "http://192.168.1.26:8222"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: obs-prometheus
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    container_name: obs-loki
    network_mode: host
    command: ["-config.file=/etc/loki/local-config.yaml"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:9.5.15
    container_name: obs-grafana
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: obs-jaeger
    network_mode: host
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
