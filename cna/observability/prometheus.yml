global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'microservices'
    static_configs:
      - targets:
          - '192.168.1.26:8000'
          - '192.168.1.26:8001'
          - '192.168.1.26:8002'
          - '192.168.1.26:8003'
        labels:
          node: 'equipo-vm2'

  - job_name: 'nats-jetstream'
    static_configs:
      - targets:
          - '127.0.0.1:7777'
        labels:
          broker: 'nats-js'
